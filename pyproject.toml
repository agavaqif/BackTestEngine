[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmaloop"
version = "0.1.0"
description = "SigmaLoop — a programmable, high-performance event-driven backtesting engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Vagif Aghayev" }]
keywords = ["backtesting", "trading", "options", "quantitative-finance"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    # CSV parsing, the Parquet conversion cache and predicate pushdown.
    "pyarrow>=14.0",
]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
polygon = ["polygon-api-client>=1.14"]
report = ["jinja2>=3.1", "matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

# Third-party plugins register themselves against these entry-point groups.
# See sigmaloop/plugins/registry.py for the loading contract.
[project.entry-points."sigmaloop.data_providers"]
csv = "sigmaloop.data.providers.csv_provider:CsvDataProvider"
yahoo = "sigmaloop.data.providers.yahoo_provider:YahooDataProvider"
polygon = "sigmaloop.data.providers.polygon_provider:PolygonDataProvider"

[project.entry-points."sigmaloop.indicators"]
sma = "sigmaloop.indicators.library:SimpleMovingAverage"
ema = "sigmaloop.indicators.library:ExponentialMovingAverage"
rsi = "sigmaloop.indicators.library:RelativeStrengthIndex"
atr = "sigmaloop.indicators.library:AverageTrueRange"

[project.entry-points."sigmaloop.execution_models"]
next_bar_open = "sigmaloop.execution.models:NextBarOpenExecutionModel"
same_bar_close = "sigmaloop.execution.models:SameBarCloseExecutionModel"

[tool.setuptools.packages.find]
include = ["sigmaloop*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# __all__ and __slots__ are ordered semantically throughout this codebase —
# base classes before their subclasses, columns in storage-layout order, and in
# types.py grouped under `# aliases` / `# enums` headings. Those lists double as
# each module's table of contents; alphabetising them would interleave unrelated
# names and lose more than the consistency it buys.
ignore = ["RUF022", "RUF023"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_any_generics = true

# pyarrow ships no py.typed marker. It is used only inside the data layer, and
# every value crossing back out is re-typed as a numpy array or a domain object.
[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
